<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Отчёт Маляру</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 251, 244, 0.88);
      --panel-2: rgba(250, 243, 232, 0.95);
      --text: #2f241d;
      --muted: #7f6a5c;
      --line: #d8c8b7;
      --accent: #5b3d33;
      --shadow: 0 14px 40px rgba(68, 45, 34, 0.10);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.75), transparent 45%),
        linear-gradient(180deg, #f8f3ea 0%, #efe5d7 100%);
    }

    .page {
      max-width: 1060px;
      margin: 0 auto;
      padding: 28px 18px 42px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(127, 106, 92, 0.20);
      box-shadow: var(--shadow);
      border-radius: 22px;
      padding: 24px;
      backdrop-filter: blur(2px);
    }

    .title {
      margin: 0 0 18px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.02em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .field {
      grid-column: span 12;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.half { grid-column: span 6; }

    label {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, transform .08s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(91, 61, 51, 0.55);
      box-shadow: 0 0 0 4px rgba(91, 61, 51, 0.10);
    }

    .work-list {
      display: grid;
      gap: 14px;
      margin-top: 2px;
    }

    .work-item {
      border: 1px solid rgba(127, 106, 92, 0.16);
      border-radius: 18px;
      padding: 14px;
      background: var(--panel-2);
    }

    .work-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .work-row .field {
      margin: 0;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .type-field {
      flex: 0 0 180px;
    }

    .name-field {
      flex: 0 0 220px;
    }

    .work-field {
      flex: 1 1 180px;
    }

    .orig-field {
      flex: 1 1 180px;
    }

    .remove-field {
      flex: 0 0 44px;
    }

    .type-field label,
	.name-field label,
    .work-field label,
    .orig-field label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .type-field select,
    .name-field select,
    .work-field input,
    .orig-field input {
      min-width: 0;
      width: 100%;
      padding: 10px 10px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(91, 61, 51, 0.16);
      background: rgba(91, 61, 51, 0.08);
      color: var(--accent);
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: grid;
      place-items: center;
      transition: transform .08s ease, background .15s ease;
      user-select: none;
    }

    .icon-btn:active { transform: translateY(1px); }

    .button {
      border: 0;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform .08s ease, opacity .15s ease, background .15s ease;
      user-select: none;
    }

    .button:active { transform: translateY(1px); }

    .button.primary {
      background: linear-gradient(180deg, var(--accent), #4a3028);
      color: #fff;
    }

    .button.secondary {
      background: rgba(91, 61, 51, 0.08);
      color: var(--accent);
      border: 1px solid rgba(91, 61, 51, 0.16);
    }

    .button.small {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }

    .result-block {
      margin-top: 18px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(127, 106, 92, 0.18);
      background: rgba(255,255,255,0.56);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(127, 106, 92, 0.14);
      background: rgba(91, 61, 51, 0.04);
    }

    .result-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    textarea#result {
      display: block;
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 16px;
      line-height: 1.55;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
    }

    .invalid {
      border-color: #b65a4d !important;
      box-shadow: 0 0 0 4px rgba(182, 90, 77, 0.10) !important;
    }

    @media (max-width: 900px) {
      .work-row {
        gap: 6px;
      }

      .name-field { flex-basis: 180px; }
      .type-field, .work-field, .orig-field { flex-basis: 150px; }
    }

    @media (max-width: 820px) {
      .field.half { grid-column: span 12; }
      .work-row { flex-wrap: wrap; }
      .type-field,
      .name-field,
      .work-field,
      .orig-field,
      .remove-field {
        flex: 1 1 100%;
      }
      .icon-btn { width: 100%; }
    }

    @media (max-width: 540px) {
      .page { padding: 12px; }
      .card { padding: 16px; border-radius: 18px; }
      .result-head { flex-direction: column; align-items: stretch; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 class="title">Отчёт Маляру</h1>

      <form id="reportForm" autocomplete="off" novalidate>
        <div class="form-grid">
          <div class="field half">
            <label for="reportId">ID</label>
            <input id="reportId" name="reportId" type="text" step="1" placeholder="Например, 1670521" required />
          </div>

          <div class="field half"></div>

          <div class="field">
            <label>Работы</label>
            <div id="workList" class="work-list"></div>
          </div>

          <div class="field">
            <button type="button" id="addWorkBtn" class="button secondary">Добавить работу</button>
          </div>
        </div>
      </form>

      <div class="result-block" aria-live="polite">
        <div class="result-head">
          <h2 class="result-title">Результат</h2>
          <button type="button" id="copyBtn" class="button primary small">Скопировать</button>
        </div>
        <textarea id="result" readonly spellcheck="false" placeholder="Здесь появится сгенерированный текст..."></textarea>
      </div>
    </section>
  </main>

  <template id="workTemplate">
    <div class="work-item">
      <div class="work-row">
        <div class="field type-field">
          <label>Тип работы</label>
          <select class="work-type" aria-label="Тип работы"></select>
        </div>

        <div class="field name-field">
          <label>Название или имя</label>
          <select class="work-name" aria-label="Название или имя"></select>
        </div>

        <div class="field work-field">
          <label>Работа</label>
          <input class="work-url" type="url" placeholder="https://..." aria-label="Работа" />
        </div>

        <div class="field orig-field">
          <label>Оригинал</label>
          <input class="original-url" type="url" placeholder="https://..." aria-label="Оригинал" />
        </div>

        <div class="field remove-field">
          <label></label>
          <button type="button" class="icon-btn remove-work" aria-label="Удалить работу" title="Удалить">✕</button>
        </div>
      </div>
    </div>
  </template>

  <script>
    const arts = {
	  'Украшение фона': {
	      'plural': 'Украшения фонов',
		  'template': 'spacoj/$1.jpg',
		  "Акулья пасть": 100358,
		  "Загадочная гладь": 100619,
		  "Водохранилище": 100743,
		  "Песчаный овраг": 100751,
		  "Пещеры леса светлячков": 100766,
		  "Мерцающие валуны": 104598,
		  "Рощица": 104662,
		  "Сухое русло": 104663,
		  "Скалистая местность": 104664,
		  "Рифы": 104665,
		  "Побережье": 143652,
		  "Тихий залив": 104667,
		  "Мелководье": 104668,
		  "Дыра в корабле": 104669,
		  "Верхняя палуба": 104670,
		  "Камбуз": 104671,
		  "Штурвал": 104672,
		  "Подвал": 104673,
		  "Шлюпки": 104674,
		  "Трюм": 104675,
		  "Каюта малышей": 104676,
		  "Каюта матросов и юнг": 104677,
		  "Каюта морских волков": 104678,
		  "Каюта кока и боцмана": 104679,
		  "Палубная рубка": 104680,
		  "Пологий берег": 104927,
		  "Заросший пляж": 104929,
		  "Живописный берег": 104930,
		  "Отвесное взморье": 105374,
		  "Тихое место": 106792,
		  "Шепчущий лес": 106793,
		  "Норка под кораблём": 106794,
		  "Беспокойные волны": 107177,
		  "Большая каюта": 110431,
		  "Бушующее море": 111890,
		  "Стеклянный пляж": 112196,
		  "Лазурные волны": 112828,
		  "Глубокий залив": 112899,
		  "Непроходимая глушь": 117897,
		  "Извилистая тропа": 118080,
		  "Ослепляющий уступ": 118081,
		  "Прибрежный бассейн": 118142,
		  "Подземные ходы": 120140,
		  "Предгорье": 125445,
		  "Чрево Соляриса": 125666,
		  "Каменная пучина": 125667,
		  "Прохладная расщелина": 125668,
		  "Сквозящий проход": 125669,
		  "Душистая кладовая": 126789,
		  "Поросшая мхом мачта": 128616,
		  "Мёртвый берег": 130885,
		  "Останки падшего": 130887,
		  "Череп морского гиганта": 130890,
		  "Акулья арена": 130895,
		  "Узкий брод": 130896,
		  "Скрытый лаз": 133196,
		  "Солёные Скалы": 133826,
		  "Крутой Склон": 133827,
		  "Палящий Утес": 133828,
		  "Заоблачная Высь": 133829,
		  "Вершина Горы": 137128,
		  "Пищащий уголок": 137129,
		  "Сундук": 137130,
		  "Лазурная бухта": 139535,
		  "Бойцовская яма": 141597,
		  "Костяная берлога": 141598,
		  "Ближние затопленные глубины": 143306,
		  "Мель": 143663,
		  "Фруктовая роща": 143654,
		  "Журчащий водопад": 143655,
		  "Цветущая равнина": 143660,
		  "Костяная тропа": 143659,
		  "Прибрежное море": 143661,
		  "Солнечная поляна": 143662,
		  "Искажённая чаща": 143665
      },
	  'Украшение бота': {
	    'plural': 'Украшения ботов',
	    'template': 'cats/0/costume/$1.png',
		"Морской Разбойник": 3077,
		"Галантный Стид": 2234,
		"Забияка-Билли": 1987,
		"Пелагус": 104676,
		"Янтарная": 104677,
		"Крыса-Лариса": 3095,
		"Рaстрёпанный Мышонок": 126789,
		"Устрица": 104665,
		"Бoродач-Костелом": 89400
      }
	};

    const form = document.getElementById('reportForm');
    const workList = document.getElementById('workList');
    const workTemplate = document.getElementById('workTemplate');
    const result = document.getElementById('result');
    const addWorkBtn = document.getElementById('addWorkBtn');
    const copyBtn = document.getElementById('copyBtn');
    const reportIdInput = document.getElementById('reportId');

    function addWorkRow() {
      const node = workTemplate.content.firstElementChild.cloneNode(true);
      const typeSelect = node.querySelector('.work-type');
      const nameSelect = node.querySelector('.work-name');
      const originalInput = node.querySelector('.original-url');
      const removeBtn = node.querySelector('.remove-work');

	  const autofill = () => {
        originalInput.value = `ибб-ссыль на ${typeSelect.value.toLowerCase()} айди ${arts[typeSelect.value][nameSelect.value]}`;
	  };

	  const onChange = () => {
        setOptions(nameSelect, Object.keys(arts[typeSelect.value]).filter(x => x !== 'template' && x !== 'plural'), nameSelect.value);
        autofill();
      };

	  setOptions(typeSelect, Object.keys(arts), workList.lastChild?.querySelector?.('.work-type')?.value);
	  onChange();

	  typeSelect.addEventListener('change', onChange);
      nameSelect.addEventListener('change', autofill);
      nameSelect.addEventListener('input', autofill);
      removeBtn.addEventListener('click', () => {
		if (workList.children.length > 1) {
		  node.remove();
		  refreshResult();
		}
	  });

      workList.appendChild(node);
    }

    function setOptions(select, options, preferredValue = '') {
      select.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
      select.value = options.includes(preferredValue) ? preferredValue : options[0];
    }

    function getFormData() {
      const idValue = Number(reportIdInput.value);
      const works = [...workList.querySelectorAll('.work-item')].map(item => ({
        type: item.querySelector('.work-type').value,
        name: item.querySelector('.work-name').value.trim(),
        workUrl: item.querySelector('.work-url').value.trim(),
        originalUrl: item.querySelector('.original-url').value.trim(),
      }));

      return { id: idValue, works };
    }

    function formatMultiple(strings) {
	  return strings.length <= 1 ? strings[0] : strings.slice(0, -1).join(', ') + ' и ' + strings.at(-1);
	}

    function refreshResult() {
	  const data = getFormData();

	  const workCounts = Object.fromEntries(Object.keys(arts).map(type => [type, data.works.filter(work => work.type === type && work.workUrl && work.originalUrl).length]));
	  const stringWorkCounts = formatMultiple(Object.entries(workCounts).filter(x => x[1] !== 0).map(x => x[0] + ' x' + x[1])) || 'ничего';

	  const works = [];
	  for (const type in arts) {
	    if (workCounts[type] === 0) continue;
		const list = [];
		for (const work of data.works) {
		  if (work.type !== type || !work.workUrl || !work.originalUrl) continue;
		  list.push(`[img]${work.workUrl}[/img]
[url]cw3/${arts[type].template.replace('$1', arts[type][work.name])}[/url]
[url]${work.workUrl}[/url]
[url]${work.originalUrl}[/url]`);
		}
		works.push(`[b]${arts[type].plural}:[/b]\n\n[table][tr]${list.map(x => '[td]' + x + '[/td]').join('\n')}[/tr][/table]`);
	  }

      let idString = `[link${data.id}] (${data.id}) нарисовал в шайку Разбитого Корабля ${stringWorkCounts}. Прошу выдать баллы за работу:`;
      reportIdInput.classList.remove('invalid');
      if (!Number.isInteger(data.id) || data.id < 0 || data.id >= 1E7) {
        reportIdInput.classList.add('invalid');
        idString = 'ID должен быть положительным числом до 7 цифр включительно.\n';
      }

      result.value = `${idString}\n\n[center]${works.join('\n\n')}[/center]`;
    }

    addWorkBtn.addEventListener('click', () => {
      addWorkRow();
      refreshResult();
    });

    form.addEventListener('input', refreshResult);
    form.addEventListener('change', refreshResult);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      refreshResult();
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(result.value || '');
        copyBtn.textContent = 'Скопировано';
        setTimeout(() => { copyBtn.textContent = 'Скопировать'; }, 1200);
      } catch {
        result.focus();
        result.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Скопировано';
        setTimeout(() => { copyBtn.textContent = 'Скопировать'; }, 1200);
      }
    });

    addWorkRow();
    reportIdInput.value = '1670521';
    refreshResult();
  </script>
</body>
</html>
