<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Отчёт Маляру</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 251, 244, 0.88);
      --panel-2: rgba(250, 243, 232, 0.95);
      --text: #2f241d;
      --muted: #7f6a5c;
      --line: #d8c8b7;
      --accent: #5b3d33;
      --shadow: 0 14px 40px rgba(68, 45, 34, 0.10);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.75), transparent 45%),
        linear-gradient(180deg, #f8f3ea 0%, #efe5d7 100%);
    }

    .page {
      max-width: 1060px;
      margin: 0 auto;
      padding: 28px 18px 42px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(127, 106, 92, 0.20);
      box-shadow: var(--shadow);
      border-radius: 22px;
      padding: 24px;
      backdrop-filter: blur(2px);
    }

    .title {
      margin: 0 0 18px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.02em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .field {
      grid-column: span 12;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.half { grid-column: span 6; }

    label {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, transform .08s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(91, 61, 51, 0.55);
      box-shadow: 0 0 0 4px rgba(91, 61, 51, 0.10);
	}

	.checkbox {
	  display: inline-flex;
	  align-items: center;
	  gap: 10px;
	  cursor: pointer;
	  user-select: none;
	  color: var(--text);
	  font-size: 12px;
	  text-transform: none;
	  line-height: 1.2;
	}

	.checkbox input[type="checkbox"] {
	  position: absolute;
	  opacity: 0;
	  width: 1px;
	  height: 1px;
	  pointer-events: none;
	}

	.checkbox-box {
	  width: 20px;
	  height: 20px;
	  border-radius: 6px;
	  border: 1px solid var(--line);
	  background: rgba(255, 255, 255, 0.72);
	  display: grid;
	  place-items: center;
	  transition: all .15s ease;
	  flex: 0 0 20px;
	}

	.checkbox-box::after {
	  content: "";
	  width: 6px;
	  height: 10px;
	  border-right: 2px solid transparent;
	  border-bottom: 2px solid transparent;
	  transform: rotate(45deg) translate(-1px, -1px);
	  transition: border-color .15s ease;
	}

	.checkbox:hover .checkbox-box {
	  border-color: rgba(91, 61, 51, 0.45);
	  box-shadow: 0 0 0 4px rgba(91, 61, 51, 0.06);
	}

	.checkbox input[type="checkbox"]:checked + .checkbox-box {
	  background: linear-gradient(180deg, var(--accent), #4a3028);
	  border-color: var(--accent);
	}

	.checkbox input[type="checkbox"]:checked + .checkbox-box::after {
	  border-right-color: #fff;
	  border-bottom-color: #fff;
	}

	.checkbox input[type="checkbox"]:focus-visible + .checkbox-box {
	  box-shadow: 0 0 0 4px rgba(91, 61, 51, 0.14);
	}

    .work-list {
      display: grid;
      gap: 14px;
      margin-top: 2px;
    }

    .work-item {
      border: 1px solid rgba(127, 106, 92, 0.16);
      border-radius: 18px;
      padding: 14px;
      background: var(--panel-2);
    }

    .work-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .work-row .field {
      margin: 0;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .type-field {
      flex: 0 0 180px;
    }

    .name-field, .id-field {
      flex: 0 0 220px;
    }

    .work-field {
      flex: 1 1 180px;
    }

    .orig-field {
      flex: 1 1 180px;
    }

    .remove-field {
      flex: 0 0 44px;
    }

	.hidden {
	  display: none;
	}

	.work-row:has(.work-name:not(.hidden)) .id-field,
	.name-field:has(.work-name.hidden),
	.work-row:has(.work-name.hidden) .original-url,
	.work-field:has(> .hidden),
	.work-row:has(.costume-field:not(.hidden)) .orig-field,
	.work-row:has(.costume-field:not(.hidden)) .work-field {
	  display: none;
	}

    .type-field label,
	.name-field label,
	.id-field label,
    .work-field label,
    .orig-field label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .type-field select,
    .name-field select,
	.id-field input,
    .work-field input,
    .orig-field input {
      min-width: 0;
      width: 100%;
      padding: 10px 10px;
    }

	.costume-field {
	  flex-grow: 1;
      justify-content: space-around;
	}

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(91, 61, 51, 0.16);
      background: rgba(91, 61, 51, 0.08);
      color: var(--accent);
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: grid;
      place-items: center;
      transition: transform .08s ease, background .15s ease;
      user-select: none;
    }

    .icon-btn:active { transform: translateY(1px); }

    .button {
      border: 0;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform .08s ease, opacity .15s ease, background .15s ease;
      user-select: none;
    }

    .button:active { transform: translateY(1px); }

    .button.primary {
      background: linear-gradient(180deg, var(--accent), #4a3028);
      color: #fff;
    }

    .button.secondary {
      background: rgba(91, 61, 51, 0.08);
      color: var(--accent);
      border: 1px solid rgba(91, 61, 51, 0.16);
    }

    .button.small {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }

    .result-block {
      margin-top: 18px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(127, 106, 92, 0.18);
      background: rgba(255,255,255,0.56);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(127, 106, 92, 0.14);
      background: rgba(91, 61, 51, 0.04);
    }

    .result-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    textarea#result {
      display: block;
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 16px;
      line-height: 1.55;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
    }

    .invalid {
      border-color: #b65a4d !important;
      box-shadow: 0 0 0 4px rgba(182, 90, 77, 0.10) !important;
    }

    @media (max-width: 900px) {
      .work-row {
        gap: 6px;
      }

      .name-field { flex-basis: 180px; }
      .type-field, .work-field, .orig-field { flex-basis: 150px; }
    }

    @media (max-width: 820px) {
      .field.half { grid-column: span 12; }
      .work-row { flex-wrap: wrap; }
      .type-field,
      .name-field,
	  .id-field,
      .work-field,
      .orig-field,
	  .costume-field,
      .remove-field {
        flex: 1 1 100%;
      }
      .icon-btn { width: 100%; }
    }

    @media (max-width: 540px) {
      .page { padding: 12px; }
      .card { padding: 16px; border-radius: 18px; }
      .result-head { flex-direction: column; align-items: stretch; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 class="title">Отчёт Маляру</h1>

      <form id="reportForm" autocomplete="off" novalidate>
        <div class="form-grid">
          <div class="field half">
            <label for="reportId">ID художника</label>
            <input id="reportId" name="reportId" type="text" input="numeric" />
          </div>

          <div class="field half"></div>

          <div class="field">
            <label>Работы</label>
            <div id="workList" class="work-list"></div>
          </div>

          <div class="field">
            <button type="button" id="addWorkBtn" class="button secondary">Добавить работу</button>
          </div>
        </div>
      </form>

      <div class="result-block" aria-live="polite">
        <div class="result-head">
          <h2 class="result-title">Результат</h2>
          <button type="button" id="copyBtn" class="button primary small">Скопировать</button>
        </div>
        <textarea id="result" readonly spellcheck="false" placeholder="Здесь появится сгенерированный текст..."></textarea>
      </div>
    </section>
  </main>

  <template id="workTemplate">
    <div class="work-item">
      <div class="work-row">
        <div class="field type-field">
          <label>Тип работы</label>
          <select class="work-type" aria-label="Тип работы"></select>
        </div>

        <div class="field name-field">
          <label>Название или имя</label>
          <select class="work-name" aria-label="Название или имя"></select>
        </div>

        <div class="field id-field">
          <label>ID</label>
          <input class="work-id" type="text" input="numeric" placeholder="ID" aria-label="ID"></select>
        </div>

        <div class="field work-field">
          <label>Работа</label>
          <input class="work-url" type="url" placeholder="Работа: https://..." aria-label="Работа" />
        </div>

        <div class="field orig-field">
          <label>Оригинал</label>
          <input class="original-url" type="url" placeholder="Оригинал: https://..." aria-label="Оригинал" />
        </div>

		<div class="field costume-field">
			<label class="field checkbox">
			  <input type="checkbox" class="costume_0" />
			  <span class="checkbox-box"></span>
			  <span>Обычная</span>
			</label>

			<label class="field checkbox">
			  <input type="checkbox" class="costume_1" />
			  <span class="checkbox-box"></span>
			  <span>Сон</span>
			</label>

			<label class="field checkbox">
			  <input type="checkbox" class="costume_-1" />
			  <span class="checkbox-box"></span>
			  <span>Котячья</span>
			</label>

			<label class="field checkbox">
			  <input type="checkbox" class="costume_5" />
			  <span class="checkbox-box"></span>
			  <span>Питьё</span>
			</label>
		</div>

        <div class="field remove-field">
          <label></label>
          <button type="button" class="icon-btn remove-work" aria-label="Удалить работу" title="Удалить">✕</button>
        </div>
      </div>
    </div>
  </template>

  <script>
    const arts = {
	  'Фон': {
		  'template': 'cw3/spacoj/$1.jpg',
		  'columns': 1,
		  "Трюм": 104675,
		  "Верхняя палуба": 104670,
		  "Капитанский мостик": 104672,
		  "Камбуз": 104671,
		  "Водохранилище": 100743,
		  "Подвал": 104673,
		  "Пологий берег": 104927,
		  "Прибрежный бассейн": 118142,
		  "Стеклянный пляж": 112196,
		  "Шлюпки": 104674,	  
		  "Каюта морских волков": 104678,
		  "Палубная рубка": 104680,
		  "Душистая кладовая": 126789,
		  "Пищащий уголок": 137129,
		  "Большая каюта": 110431,
		  "Дыра в корабле": 104669,
		  "Песчаный овраг": 100751,
		  "Скалистая местность": 104664,
	  },
	  'Бот': {
		  'template': 'cw3/cats/0/costume/$1.png',
		  'columns': 4,
		  "Морской Разбойник": 3077,
		  "Галантный Стид": 2234,
		  "Забияка-Билли": 1987,
		  "Пелагус": 104676,
		  "Янтарная": 104677,
		  "Крыса-Лариса": 3095,
		  "Рaстрёпанный Мышонок": 126789,
		  "Устрица": 104665,
		  "Бoродач-Костелом": 89400
	  },
	  'Предмет': {
		  'template': 'cw3/things/$1.png',
		  'columns': 5,
		  'noOffsite': true
	  },
	  'Медаль': {
		  'template': 'medal/$1.png',
		  'columns': 6,
		  'noOffsite': true
	  },
	  'Костюм': {
		  'template': 'cw3/cats/$2/costume/$1.png',
		  'columns': 3,
		  'noOffsite': true
	  },
	  'Иллюстрация': {
		  'template': 'blog$1',
		  'columns': 1
	  },
	  'Шапка': {
		  'template': 'blog$1',
		  'columns': 1
	  }
	};

	const allArts = ['Медаль', 'Предмет', 'Костюм', 'Бот', 'Украшение бота', 'Шапка', 'Иллюстрация', 'Фон', 'Украшение фона'];

	const originals = {
	  "Трюм": "https://ibb.co/wN0fhwVr",
	  "Верхняя палуба": "https://ibb.co/MvZ8djG",
	  "Капитанский мостик": "https://ibb.co/67mQ8qFG",
	  "Камбуз": "https://ibb.co/0VR8w2qB",
	  "Водохранилище": "https://ibb.co/9kQGKQZz",
	  "Подвал": "https://ibb.co/fG0rRsMS",
	  "Пологий берег": "https://ibb.co/fG0rRsMShttps://ibb.co/DgtYGf5L",
	  "Прибрежный бассейн": "https://ibb.co/HTFCYjSg",
	  "Стеклянный пляж": "https://ibb.co/pjy1MbwS",
	  "Шлюпки": "https://ibb.co/W40rGgjD",	  
	  "Каюта морских волков": "https://ibb.co/27Ns2wgH",
	  "Палубная рубка": "https://ibb.co/Gf5mk989",
	  "Душистая кладовая": "https://ibb.co/sJJwfYD1",
	  "Пищащий уголок": 137129,
	  "Большая каюта": "https://ibb.co/ZzRKT1BP",
	  "Дыра в корабле": "https://ibb.co/XxbfhKvz",
	  "Песчаный овраг": "https://ibb.co/81dZCjF",
	  "Скалистая местность": "https://ibb.co/MkNGvJzF",
	  "Морской Разбойник": "https://ibb.co/5xz0VmNc",
	  "Галантный Стид": "https://ibb.co/1GQ3JfT2",
	  "Забияка-Билли": "https://ibb.co/pBYkHTLc",
	  "Пелагус": "https://ibb.co/mC3Fpjyv",
	  "Янтарная": "https://ibb.co/4RHdHJXP",
	  "Крыса-Лариса": "https://ibb.co/SDQQs62Y",
	  "Рaстрёпанный Мышонок": "https://ibb.co/pvhz8xKB",
	  "Устрица": "https://ibb.co/GQZKY4kM",
	  "Бoродач-Костелом": "https://ibb.co/j99Bp9D3"
	};

    const form = document.getElementById('reportForm');
    const workList = document.getElementById('workList');
    const workTemplate = document.getElementById('workTemplate');
    const result = document.getElementById('result');
    const addWorkBtn = document.getElementById('addWorkBtn');
    const copyBtn = document.getElementById('copyBtn');
    const reportIdInput = document.getElementById('reportId');

	function toTitle(text) {
	  return text[0].toUpperCase() + text.slice(1).toLowerCase();
	}

	function designify(type) {
	  return `Украшение ${type.toLowerCase()}а`;
	}

	function undesignify(type) {
	  return type.startsWith('Украшение') ? toTitle(type.slice('Украшение '.length, -'а'.length)) : type;
	}

	function plural(type) {
	  switch (type) {
	    case 'Шапка':
		  return 'Шапки';
		case 'Иллюстрация':
		  return 'Иллюстрации';
		case 'Медаль':
		  return 'Медали';
	    default:
		  return type.startsWith('Украшение') ? type.replace('Украшение', 'Украшения').slice(0, -1) + 'ов' : type + 'ы';
	  }
	}

    function addWorkRow() {
      const node = workTemplate.content.firstElementChild.cloneNode(true);
      const typeSelect = node.querySelector('.work-type');
      const nameSelect = node.querySelector('.work-name');
      const workSelect = node.querySelector('.work-url');
      const costumeSelect = node.querySelector('.costume-field');
      const originalInput = node.querySelector('.original-url');
      const removeBtn = node.querySelector('.remove-work');

	  const autofill = () => {
        originalInput.value = originals[nameSelect.value] || '';
	  };

	  const onChange = () => {
	    workSelect.classList.toggle('hidden', Boolean(arts[typeSelect.value]?.noOffsite));
	    costumeSelect.classList.toggle('hidden', typeSelect.value !== 'Костюм');
	    nameSelect.classList.toggle('hidden', typeSelect.value === undesignify(typeSelect.value));
        setOptions(nameSelect, Object.keys(arts[undesignify(typeSelect.value)]).filter(x => /\W/.test(x)), nameSelect.value);
        autofill();
      };

	  setOptions(typeSelect, allArts, workList.lastChild?.querySelector?.('.work-type')?.value);
	  onChange();

	  typeSelect.addEventListener('change', onChange);
      nameSelect.addEventListener('change', autofill);
      nameSelect.addEventListener('input', autofill);
      removeBtn.addEventListener('click', () => {
		node.remove();
		refreshResult();
	  });

      workList.appendChild(node);
    }

    function setOptions(select, options, preferredValue = '') {
      select.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
      select.value = options.includes(preferredValue) ? preferredValue : options[0];
    }

	function getValue(elem) {
	  return elem.offsetParent ? elem.value.trim() : null;
	}

    function getFormData() {
      const id = Number(reportIdInput.value);
      const works = [...workList.querySelectorAll('.work-item')].map(item => ({
        type: getValue(item.querySelector('.work-type')),
        name: getValue(item.querySelector('.work-name')),
        id: getValue(item.querySelector('.work-id')),
        urls: item.querySelector('.costume-field').offsetParent
			? [...item.querySelectorAll('.costume-field :checked')].map(x => arts.Костюм.template.replace('$1', getValue(item.querySelector('.work-id'))).replace('$2', x.className.slice('costume_'.length)))
			: [getValue(item.querySelector('.work-url'))],
        originalUrl: getValue(item.querySelector('.original-url')),
      }));

      return { id, works };
    }

    function formatMultiple(strings) {
	  return strings.length <= 1 ? strings[0] : strings.slice(0, -1).join(', ') + ' и ' + strings.at(-1);
	}

	function formatTableInternal(list, cols) {
	  const rows = Math.ceil(list.length / cols);
	  cols = Math.ceil(list.length / rows);
	  return '[table]' + list.map(x => '[td]' + x + '[/td]').reduce((acc, val, i) => (i <= cols * (rows - rows * cols + list.length) ? i % cols === 0 : (list.length - i) % (cols - 1) === 0) ? [...acc, [val]] : [...acc.slice(0, -1), [...acc.at(-1), val]], []).map(x => '[tr]' + x.join('') + '[/tr]').join('\n') + '[/table]';
	}

	function formatTable(listOfLists, cols) {
		return listOfLists.some(x => x.length > 1) ? listOfLists.map(x => formatTableInternal(x, cols)).join('\n') : formatTableInternal(listOfLists.flat(), cols);
	}

    function refreshResult() {
	  const data = getFormData();

	  const works = [];
	  for (const type of allArts) {
		const simpleType = undesignify(type);
		const list = [];
		for (const work of data.works) {
		  if (work.type !== type || (!work.name && !work.id) || (!work.urls.some(x => x) && simpleType !== 'Предмет') || (!work.originalUrl && type !== simpleType)) continue;
		  const siteURL = arts[simpleType].template.replace('$1', arts[simpleType][work.name] || work.id);
		  if (!work.urls.some(x => x)) work.urls = [siteURL];
		  list.push(work.urls.map(url => 
		    `[img]${url}[/img]
${arts[simpleType].noOffsite ? '' : `[url]${siteURL}[/url]\n`}[url]${url}[/url]${simpleType !== type ? `\n[url]${work.originalUrl}[/url]` : ''}`
          ));
		}
		if (list.length > 0) works.push(`[b]${plural(type)}:[/b]\n\n${formatTable(list, arts[simpleType].columns)}`);
	  }

	  const workCounts = formatMultiple(Object.entries(Object.groupBy(data.works.filter(work => (work.name || work.id) && (work.urls.some(x => x) || (arts[work.type]?.noOffsite && work.type !== 'Костюм')) && (work.originalUrl || undesignify(work.type) === work.type)), work => work.type === 'Костюм' ? `${work.type} на ${work.urls.length} стадии` : work.type)).filter(x => x[1].length > 0).map(x => x[0] + ' x' + x[1].length)) || 'ничего';

      let idString = `[link${data.id}] (${data.id}) нарисовал в шайку Разбитого Корабля ${workCounts}. Прошу выдать баллы за работу:`;
      reportIdInput.classList.remove('invalid');
      if (!Number.isInteger(data.id)) {
        reportIdInput.classList.add('invalid');
        idString = 'ID должен быть числом.';
      }

      result.value = `${idString}\n\n[center]${works.join('\n\n')}[/center]`;
    }

    addWorkBtn.addEventListener('click', () => {
      addWorkRow();
      refreshResult();
    });

    form.addEventListener('input', refreshResult);
    form.addEventListener('change', refreshResult);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      refreshResult();
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(result.value || '');
        copyBtn.textContent = 'Скопировано';
        setTimeout(() => { copyBtn.textContent = 'Скопировать'; }, 1200);
      } catch {
        result.focus();
        result.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Скопировано';
        setTimeout(() => { copyBtn.textContent = 'Скопировать'; }, 1200);
      }
    });

    addWorkRow();
    refreshResult();
  </script>
</body>
</html>
